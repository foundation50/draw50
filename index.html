<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Draw50 — Web Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="draw-canvas" aria-label="Drawing canvas"></canvas>

  <div id="toolbar" class="overlay">
    <button id="fullscreen-btn" title="Enter fullscreen (F)">⤢</button>
    <div id="controls">
      <label class="control">
        <span>Stroke</span>
        <input id="color" type="color" value="#ffffff" title="Stroke color">
      </label>
      <label class="control">
        <span>Width</span>
        <input id="width" type="range" min="1" max="60" value="6">
      </label>
    </div>
  </div>

  <div id="hint" class="overlay hint">Tip: press F to toggle fullscreen, Esc to exit</div>

  <script type="module" src="app.js"></script>
</body>
</html>
