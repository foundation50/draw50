<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Draw50 — Web Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="draw-app">
    <canvas id="transition-canvas" aria-hidden="true"></canvas>
    <canvas id="draw-canvas" aria-label="Drawing canvas"></canvas>

    <div id="toolbar" class="overlay">
      <output id="page-indicator" aria-live="polite">Page 0</output>
      <div id="controls">
        <label class="control">
          <span>Stroke</span>
          <button id="color" type="button" value="#ffffff" title="Cycle stroke color" aria-label="Cycle stroke color"></button>
        </label>
        <label class="control">
          <span>Size <output id="width-value">0</output></span>
          <input id="width" type="range" min="0" max="9" step="1" value="0">
        </label>
      </div>
    </div>

    <div id="hint" class="overlay hint">U: UI · Up/down: pages · Left/right: size · Backspace: undo · C: clear</div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
